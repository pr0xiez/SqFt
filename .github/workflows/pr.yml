name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when a PR is pushed again — saves time and frees the
# single self-hosted runner for the latest commit.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# RUNNER SELECTION
# -----------------------------------------------------------------------------
# Every job picks its runner from the `CI_RUNNER` repository variable, so you
# can switch the whole pipeline between your self-hosted runner and GitHub's
# hosted runners without editing this file.
#
# To flip it:
#   Repo → Settings → Secrets and variables → Actions → Variables tab →
#   set CI_RUNNER to either `self-hosted` or `ubuntu-latest`.
#   Takes effect on the next workflow run; no code change or PR needed.
#
# If CI_RUNNER is unset/empty it defaults to `self-hosted` (so a missing
# variable never silently burns hosted minutes).
# =============================================================================

jobs:
  typecheck:
    name: Type Check
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint & Format
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:ci

  test:
    name: Tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Ephemeral Neon branch so the real-DB repository integration suites
      # (gated in vitest.setup.ts on VITEST_DB_AVAILABLE, which is only set
      # when DATABASE_URL is present) actually run here instead of silently
      # skipping — mocked repo suites already run regardless. A `services:
      # postgres` container was the other option, but this job's runner
      # defaults to the self-hosted macOS runner (see RUNNER SELECTION above
      # and the e2e job's "macOS self-hosted" note), and GitHub Actions
      # service containers require a Linux runner — that would break the
      # default `CI_RUNNER` unset case. Branching off Neon works on either
      # runner and reuses the same NEON_PROJECT_ID/NEON_API_KEY already wired
      # for preview-branch cleanup in delete-neon-branch.yml.
      - name: Create ephemeral Neon test branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-test/${{ github.run_id }}-${{ github.run_attempt }}
          prisma: true
      - name: Apply migrations
        # Direct (unpooled) connection — migrate deploy's advisory lock isn't
        # meant to go through PgBouncer, mirroring the -pooler strip in the
        # root vercel.json buildCommand.
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
      - name: Run tests
        # Pooled connection — vitest runs suites across multiple
        # workers/files concurrently, each with its own Prisma client.
        run: npm test
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
      - name: Delete ephemeral Neon test branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ci-test/${{ github.run_id }}-${{ github.run_attempt }}
          api_key: ${{ secrets.NEON_API_KEY }}

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Stub values — Next.js doesn't connect to the DB at build time.
          # Replace with real GitHub Actions secrets for production builds.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-not-real

  e2e:
    name: E2E Tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      pull-requests: read
      deployments: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head commit (not the merge ref) with its parent so
          # the step below evaluates the same HEAD^..HEAD diff that Vercel's
          # ignoreCommand does.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Detect app (non-www) changes
        id: changes
        # Mirror the root vercel.json ignoreCommand
        # (git diff --quiet HEAD^ HEAD -- . ':(exclude)www'). When the head
        # commit only touches www/, Vercel skips the app deploy — so there is
        # no preview for Playwright to wait on and the job would otherwise hang
        # until the 10-min timeout. Short-circuit to a green E2E job instead.
        run: |
          if git diff --quiet HEAD^ HEAD -- . ':(exclude)www'; then
            echo "Only www/ changed on the head commit — Vercel skips the app deploy; skipping E2E."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "App (non-www) changes detected — running E2E."
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        if: steps.changes.outputs.app == 'true'
      - name: Install Playwright browsers
        if: steps.changes.outputs.app == 'true'
        # --with-deps is Linux-only (apt). Skip it on the macOS self-hosted
        # runner; the conditional keeps this correct if Phase 2 ever lands a
        # job on hosted ubuntu.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Wait for Vercel preview
        id: vercel
        if: steps.changes.outputs.app == 'true'
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the app project; ignore Preview – sqft-www (marketing site
          # has its own bypass secret and would 401 here). Must match the
          # GitHub deployment environment name verbatim, en-dash included.
          environment: Preview – sqft
          max_timeout: 600 # 10 min — bump if your builds are longer
          check_interval: 5
      - name: Run Playwright
        if: steps.changes.outputs.app == 'true'
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Temporarily disabled: out of artifact-storage resources. Re-enable when
      # storage frees up.
      # - name: Upload Playwright report
      #   if: always() && steps.changes.outputs.app == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 14
