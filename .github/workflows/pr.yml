name: PR Checks

on:
  pull_request:
    branches: [main]
  # Also check main itself after merges. PR runs test the PR merged into the
  # main of that moment; a later merge can still break main, and without this
  # trigger nothing would notice. E2E is PR-only (see the e2e job).
  push:
    branches: [main]

# Cancel superseded runs when a PR is pushed again — saves time and frees the
# single self-hosted runner for the latest commit. Pushes to main are never
# cancelled, so every main commit gets a complete result.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# =============================================================================
# RUNNER SELECTION
# -----------------------------------------------------------------------------
# Every job picks its runner from the `CI_RUNNER` repository variable, so you
# can switch the whole pipeline between your self-hosted runner and GitHub's
# hosted runners without editing this file.
#
# To flip it:
#   Repo → Settings → Secrets and variables → Actions → Variables tab →
#   set CI_RUNNER to either `self-hosted` or `ubuntu-latest`.
#   Takes effect on the next workflow run; no code change or PR needed.
#
# If CI_RUNNER is unset/empty it defaults to `self-hosted` (so a missing
# variable never silently burns hosted minutes).
# =============================================================================

jobs:
  typecheck:
    name: Type Check
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint & Format
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:ci

  test:
    name: Tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Stub values — Next.js doesn't connect to the DB at build time.
          # Replace with real GitHub Actions secrets for production builds.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-not-real

  e2e:
    name: E2E Tests
    # PR-only: it runs against the PR's Vercel preview deployment (and reads
    # github.event.pull_request), which a push to main doesn't have.
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # TEMPORARY (added 2026-10-29): PR previews currently fail to build —
    # the Neon project is at its free-plan branch limit, so the Vercel–Neon
    # integration can't create a preview DB branch and `prisma migrate deploy`
    # gets an empty DATABASE_URL. Until previews deploy again, an E2E failure
    # is reported (red job) but doesn't fail the PR's workflow run. This also
    # hides genuine Playwright failures, so remove it as soon as a PR preview
    # deploys successfully again.
    continue-on-error: true
    env:
      # GitHub deployment environment of the app project. Pinned so we ignore
      # Preview – sqft-www (marketing site has its own bypass secret and would
      # 401 here). Must match verbatim, en-dash included.
      VERCEL_PREVIEW_ENVIRONMENT: Preview – sqft
    permissions:
      contents: read
      pull-requests: read
      deployments: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head commit (not the merge ref) with its parent so
          # the step below evaluates the same HEAD^..HEAD diff that Vercel's
          # ignoreCommand does.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Detect app (non-www) changes
        id: changes
        # Run the same parent-aware check as root vercel.json. When the head
        # commit only touches www/, Vercel skips the app deploy — so there is
        # no preview for Playwright to wait on and the job would otherwise hang
        # until the 10-min timeout. Short-circuit to a green E2E job instead.
        run: |
          if bash scripts/ignore-app-deploy.sh; then
            echo "No app changes across commit parents — skipping app deployment and E2E."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "App (non-www) changes detected — running E2E."
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        if: steps.changes.outputs.app == 'true'
      - name: Install Playwright browsers
        if: steps.changes.outputs.app == 'true'
        # --with-deps is Linux-only (apt). Skip it on the macOS self-hosted
        # runner; the conditional keeps this correct if Phase 2 ever lands a
        # job on hosted ubuntu.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Wait for Vercel preview
        id: vercel
        if: steps.changes.outputs.app == 'true'
        # Reads every status of the PR head's Vercel deployment (see the script
        # for the status semantics): fails at once on failure/error, waits out
        # a cancel-then-rebuild, and outputs the URL of the successful build.
        # Replaces patrickedqvist/wait-for-vercel-preview, which read only the
        # newest status, so a failed build hung until its 10-min timeout and an
        # `inactive` one either hung or (allow_inactive) gave a cancelled URL.
        uses: actions/github-script@v7
        with:
          script: |
            const { waitForVercelPreview } = require("./scripts/wait-for-vercel-preview.cjs");
            await waitForVercelPreview({
              github, context, core,
              environment: process.env.VERCEL_PREVIEW_ENVIRONMENT,
              sha: context.payload.pull_request.head.sha,
            });
      - name: Run Playwright
        if: steps.changes.outputs.app == 'true'
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Temporarily disabled: out of artifact-storage resources. Re-enable when
      # storage frees up.
      # - name: Upload Playwright report
      #   if: always() && steps.changes.outputs.app == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 14
