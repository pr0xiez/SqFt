name: PR Checks

on:
  pull_request:
    branches: [main]

# Cancel superseded runs when a PR is pushed again — saves time and frees the
# single self-hosted runner for the latest commit.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# RUNNER SELECTION
# -----------------------------------------------------------------------------
# Every job picks its runner from the `CI_RUNNER` repository variable, so you
# can switch the whole pipeline between your self-hosted runner and GitHub's
# hosted runners without editing this file.
#
# To flip it:
#   Repo → Settings → Secrets and variables → Actions → Variables tab →
#   set CI_RUNNER to either `self-hosted` or `ubuntu-latest`.
#   Takes effect on the next workflow run; no code change or PR needed.
#
# If CI_RUNNER is unset/empty it defaults to `self-hosted` (so a missing
# variable never silently burns hosted minutes).
# =============================================================================

jobs:
  typecheck:
    name: Type Check
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: Lint & Format
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:ci

  test:
    name: Tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Stub values — Next.js doesn't connect to the DB at build time.
          # Replace with real GitHub Actions secrets for production builds.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-placeholder-not-real

  e2e:
    name: E2E Tests
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # TEMPORARY (added 2026-10-29): PR previews currently fail to build —
    # the Neon project is at its free-plan branch limit, so the Vercel–Neon
    # integration can't create a preview DB branch and `prisma migrate deploy`
    # gets an empty DATABASE_URL. Until previews deploy again, an E2E failure
    # is reported (red job) but doesn't fail the PR's workflow run. This also
    # hides genuine Playwright failures, so remove it as soon as a PR preview
    # deploys successfully again.
    continue-on-error: true
    env:
      # GitHub deployment environment of the app project. Pinned so we ignore
      # Preview – sqft-www (marketing site has its own bypass secret and would
      # 401 here). Must match verbatim, en-dash included.
      VERCEL_PREVIEW_ENVIRONMENT: Preview – sqft
    permissions:
      contents: read
      pull-requests: read
      deployments: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head commit (not the merge ref) with its parent so
          # the step below evaluates the same HEAD^..HEAD diff that Vercel's
          # ignoreCommand does.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Detect app (non-www) changes
        id: changes
        # Run the same parent-aware check as root vercel.json. When the head
        # commit only touches www/, Vercel skips the app deploy — so there is
        # no preview for Playwright to wait on and the job would otherwise hang
        # until the 10-min timeout. Short-circuit to a green E2E job instead.
        run: |
          if bash scripts/ignore-app-deploy.sh; then
            echo "No app changes across commit parents — skipping app deployment and E2E."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "App (non-www) changes detected — running E2E."
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.app == 'true'
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        if: steps.changes.outputs.app == 'true'
      - name: Install Playwright browsers
        if: steps.changes.outputs.app == 'true'
        # --with-deps is Linux-only (apt). Skip it on the macOS self-hosted
        # runner; the conditional keeps this correct if Phase 2 ever lands a
        # job on hosted ubuntu.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Check Vercel preview deployment status
        if: steps.changes.outputs.app == 'true'
        # wait-for-vercel-preview keeps retrying a deployment that has already
        # failed until max_timeout (10 min). Watch the PR head's GitHub
        # deployment ourselves and fail as soon as Vercel reports failure/error;
        # on success, the wait step below returns almost immediately.
        uses: actions/github-script@v7
        with:
          script: |
            const environment = process.env.VERCEL_PREVIEW_ENVIRONMENT;
            const sha = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              // Newest first, so [0] is the latest (re)deploy of this commit.
              const { data: deployments } = await github.rest.repos.listDeployments({
                ...context.repo, sha, environment, per_page: 1,
              });
              const deployment = deployments[0];
              const { data: statuses } = deployment
                ? await github.rest.repos.listDeploymentStatuses({
                    ...context.repo, deployment_id: deployment.id, per_page: 1,
                  })
                : { data: [] };
              const status = statuses[0];
              if (status?.state === "success") {
                core.info(`Vercel preview ready: ${status.environment_url}`);
                return;
              }
              if (status?.state === "failure" || status?.state === "error") {
                core.setFailed(
                  `Vercel preview deployment for ${sha.slice(0, 7)} (${environment}) ` +
                    `reported "${status.state}", so there is nothing to run E2E against. ` +
                    `Vercel says: "${status.description || "(no description)"}". ` +
                    `Deployment: ${status.log_url || status.target_url || "(none)"}`,
                );
                return;
              }
              core.info(
                deployment
                  ? `Deployment ${deployment.id}: ${status?.state ?? "no status yet"}; waiting…`
                  : `No "${environment}" deployment for ${sha.slice(0, 7)} yet; waiting…`,
              );
              await new Promise((r) => setTimeout(r, 5000));
            }
            core.setFailed(
              `Timed out after 10 min waiting for a "${environment}" deployment of ${sha.slice(0, 7)}.`,
            );
      - name: Wait for Vercel preview
        id: vercel
        if: steps.changes.outputs.app == 'true'
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.3
        with:
          vercel_protection_bypass_header: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ env.VERCEL_PREVIEW_ENVIRONMENT }}
          max_timeout: 600 # 10 min — bump if your builds are longer
          check_interval: 5
      - name: Run Playwright
        if: steps.changes.outputs.app == 'true'
        run: npx playwright test
        env:
          BASE_URL: ${{ steps.vercel.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Temporarily disabled: out of artifact-storage resources. Re-enable when
      # storage frees up.
      # - name: Upload Playwright report
      #   if: always() && steps.changes.outputs.app == 'true'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: playwright-report
      #     path: playwright-report/
      #     retention-days: 14
