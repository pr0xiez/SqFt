name: Delete neon preview db branch
on:
  pull_request:
    types: [closed]
jobs:
  delete-branch:
    # Pinned to self-hosted while hosted minutes are exhausted (see pr.yml
    # Phase 2 notes). This is a Node/API action, so it runs fine on macOS.
    runs-on: self-hosted
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
