name: Delete neon preview db branch
on:
  pull_request:
    types: [closed]
jobs:
  delete-branch:
    # Runner is chosen by the CI_RUNNER repository variable (see pr.yml for how
    # to flip it). Defaults to self-hosted if unset. This is a Node/API action,
    # so it runs fine on either macOS self-hosted or ubuntu-latest.
    #
    # Note: this job fires on PR *close*. If you keep it on self-hosted, a
    # sleeping runner delays cleanup and can leave an orphaned Neon preview
    # branch; ubuntu-latest is the more reliable home for it (~3s job).
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    steps:
      - uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
