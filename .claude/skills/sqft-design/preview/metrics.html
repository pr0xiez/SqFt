<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 22px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e6e4dd;border:1px solid #e6e4dd;border-radius:8px;overflow:hidden">
  <div style="background:#fff;padding:18px">
    <div class="label" style="margin-bottom:8px">Revenue · this month</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em;color:#3d6b4a">$38,420</div>
    <div class="mono" style="font-size:10px;color:#3d6b4a;margin-top:4px">↑ 12% vs. last month</div>
  </div>
  <div style="background:#fff;padding:18px">
    <div class="label" style="margin-bottom:8px">Outstanding</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em;color:#c0341a">$11,260</div>
    <div class="mono" style="font-size:10px;color:#c0341a;margin-top:4px">3 invoices unpaid</div>
  </div>
  <div style="background:#fff;padding:18px">
    <div class="label" style="margin-bottom:8px">Pipeline</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em;color:#b07a1a">$54,800</div>
    <div class="mono" style="font-size:10px;color:#6b6b66;margin-top:4px">8 open quotes</div>
  </div>
  <div style="background:#fff;padding:18px">
    <div class="label" style="margin-bottom:8px">Avg margin</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em">31%</div>
    <div class="mono" style="font-size:10px;color:#3d6b4a;margin-top:4px">↑ 2 pts</div>
  </div>
</div>
</body></html>
