<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:24px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div>
    <div class="label" style="margin-bottom:10px">Resting</div>
    <div style="background:#fff;border:1px solid #e6e4dd;border-radius:8px;padding:18px;box-shadow:0 1px 2px rgba(20,18,12,.04),0 4px 14px rgba(20,18,12,.04)">
      <div style="font-size:14px;font-weight:600">Card</div>
      <div class="mono" style="font-size:11px;color:#6b6b66;margin-top:4px">1px hairline border</div>
    </div>
  </div>
  <div>
    <div class="label" style="margin-bottom:10px">Elevated · panels, toasts</div>
    <div style="background:#fff;border:1px solid #e6e4dd;border-radius:8px;padding:18px;box-shadow:0 4px 12px rgba(20,18,12,.08),0 12px 40px rgba(20,18,12,.08)">
      <div style="font-size:14px;font-weight:600">Panel</div>
      <div class="mono" style="font-size:11px;color:#6b6b66;margin-top:4px">warm shadow, never neutral black</div>
    </div>
  </div>
</div>
</body></html>
