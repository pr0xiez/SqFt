<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.field-label{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.field-input{width:100%;font-family:var(--display);font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;border-radius:6px}
.field-input:focus{outline:none;border-color:var(--ink-2)}
.field-cd{font-size:13px;border:none;border-bottom:1px solid var(--line);background:transparent;padding:5px 0;width:100%}
</style></head>
<body style="padding:20px 24px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
  <div>
    <label class="field-label">Email</label>
    <input class="field-input" placeholder="you@yourcompany.com" value="mike@millerflooring.com"/>
  </div>
  <div>
    <label class="field-label">Source</label>
    <select class="field-input"><option>Phone call</option><option>Online lead</option></select>
  </div>
  <div>
    <label class="field-label">Phone</label>
    <input class="field-cd" value="(614) 555-0188"/>
  </div>
  <div>
    <label class="field-label">Address</label>
    <input class="field-cd" value="89 Oak Ave, Worthington"/>
  </div>
</div>
</body></html>
