<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px">
<div style="display:flex;gap:10px;align-items:flex-end">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">4</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">8</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">12</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">16</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">20</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">24</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">32</div></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:40px;background:#1a1a17"></div><div class="mono" style="font-size:9px;color:#6b6b66">40</div></div>
</div>
<div class="mono" style="font-size:10px;color:#6b6b66;margin-top:14px;letter-spacing:.04em">4px base · Card padding 18–20 · Section gutter 24–32</div>
</body></html>
