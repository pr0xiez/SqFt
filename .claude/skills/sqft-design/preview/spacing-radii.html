<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:20px 24px">
<div style="display:flex;gap:14px;align-items:flex-end">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;background:#fff;border:1px solid #e6e4dd;border-radius:4px"></div>
    <div class="mono" style="font-size:10px;color:#6b6b66">4 · chip / badge</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;background:#fff;border:1px solid #e6e4dd;border-radius:6px"></div>
    <div class="mono" style="font-size:10px;color:#6b6b66">6 · button / input</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;background:#fff;border:1px solid #e6e4dd;border-radius:8px"></div>
    <div class="mono" style="font-size:10px;color:#6b6b66">8 · card / panel</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="width:64px;height:64px;background:#1a1a17;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600">MJ</div>
    <div class="mono" style="font-size:10px;color:#6b6b66">50% · avatar</div>
  </div>
</div>
</body></html>
