<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px 22px">
<div style="background:#fff;border:1px solid #e6e4dd;border-radius:8px;overflow:hidden">
  <div style="display:grid;grid-template-columns:1fr 130px 100px 90px;background:#f4f3ed;border-bottom:1px solid #e6e4dd">
    <div class="label" style="padding:10px 14px">Customer</div>
    <div class="label" style="padding:10px 14px">Source</div>

  </div>

    <div style="padding:14px"><div style="font-size:14px;font-weight:600;letter-spacing:-.01em">Henderson, K.</div><div class="mono" style="font-size:10px;color:#6b6b66;margin-top:3px">(614) 555-0142</div></div>
    <div style="padding:14px"><span style="display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;letter-spacing:.04em;border:1px solid #3d6b4a;color:#3d6b4a">PHONE</span></div>
    <div style="padding:14px;font-size:16px;font-weight:600">3</div>
    <div style="padding:14px" class="mono">Jan 18</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 130px 100px 90px;align-items:center;border-left:3px solid #b07a1a">
    <div style="padding:14px"><div style="font-size:14px;font-weight:600;letter-spacing:-.01em">Chen, L.</div><div class="mono" style="font-size:10px;color:#6b6b66;margin-top:3px">(614) 555-0211</div></div>
    <div style="padding:14px"><span style="display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border-radius:4px;letter-spacing:.04em;border:1px solid #b07a1a;color:#b07a1a">ONLINE</span></div>
    <div style="padding:14px;font-size:16px;font-weight:600">1</div>
    <div style="padding:14px" class="mono">Feb 18</div>
  </div>
</div>
