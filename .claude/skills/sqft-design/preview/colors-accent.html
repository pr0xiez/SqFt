<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
  <div class="swatch" style="background:#c0341a;color:#fff"><div class="s-name">Accent</div><div class="s-hex">--accent · #c0341a</div></div>
  <div class="swatch" style="background:#e04828;color:#fff"><div class="s-name">Accent light</div><div class="s-hex">--accent-l · #e04828</div></div>
  <div class="swatch" style="background:#8a2010;color:#fff"><div class="s-name">Accent dark</div><div class="s-hex">--accent-d · #8a2010</div></div>
</div>
<div style="margin-top:12px;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:#6b6b66">
  <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0341a"></span>
  Vermilion. The only loud hue. Used on the wordmark, money values, danger alerts, accent buttons.
</div>
</body></html>
