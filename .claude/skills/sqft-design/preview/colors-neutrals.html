<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:18px">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
  <div class="swatch" style="background:#fafaf7;color:#1a1a17"><div class="s-name">Page</div><div class="s-hex">--bg · #fafaf7</div></div>
  <div class="swatch" style="background:#ffffff;color:#1a1a17"><div class="s-name">Surface</div><div class="s-hex">--surface · #ffffff</div></div>
  <div class="swatch" style="background:#f4f3ed;color:#1a1a17"><div class="s-name">Surface 2</div><div class="s-hex">--surface-2 · #f4f3ed</div></div>
  <div class="swatch" style="background:#1a1a17;color:#fafaf7"><div class="s-name">Ink</div><div class="s-hex">--ink · #1a1a17</div></div>
  <div class="swatch" style="background:#3a3a35;color:#fafaf7"><div class="s-name">Ink 2</div><div class="s-hex">--ink-2 · #3a3a35</div></div>
  <div class="swatch" style="background:#6b6b66;color:#fafaf7"><div class="s-name">Muted</div><div class="s-hex">--muted · #6b6b66</div></div>
</div>
</body></html>
