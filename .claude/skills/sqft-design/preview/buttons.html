<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{font-family:var(--mono);font-size:11px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:6px;letter-spacing:.02em;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-ghost{border-color:transparent;background:transparent}
</style></head>
<body style="padding:24px">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <button class="btn">+ New Customer</button>
  <button class="btn btn-primary">+ New Estimate</button>
  <button class="btn btn-accent">Send to customer →</button>
  <button class="btn btn-ghost">Cancel</button>
</div>
<div style="margin-top:16px;display:flex;gap:8px;align-items:center">
  <button class="btn" style="font-size:10px;padding:5px 12px">Open</button>
  <button class="btn" style="font-size:10px;padding:5px 12px;color:#c0341a;border-color:#c0341a">Remove</button>
  <span class="mono" style="font-size:10px;color:#6b6b66">small variants — table actions, line items</span>
</div>
</body></html>
