<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="padding:14px 18px">
<div style="background:#1a1a17;color:#fafaf7;padding:18px 22px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px">
  <div>
    <div class="mono" style="font-size:11px;color:#888579;margin-bottom:4px;letter-spacing:.04em">Gross area</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em">202 sf</div>
  </div>
  <div>
    <div class="mono" style="font-size:11px;color:#888579;margin-bottom:4px;letter-spacing:.04em">Order qty</div>
    <div style="font-size:26px;font-weight:700;letter-spacing:-.025em;color:#d4982a">222 sf</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="mono" style="font-size:11px;color:#888579">Waste</span>
    <select style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fafaf7;border-radius:5px">
      <option>+10%</option>
    </select>
  </div>
</div>
</body></html>
